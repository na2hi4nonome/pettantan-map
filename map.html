<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>マップ | 食べて歩いてぺったんたん 非公式マップ</title>
    <meta
      name="description"
      content="「食べて歩いてぺったんたん」参加店舗を地図で確認できる非公式マップです。"
    />
    <meta
      property="og:title"
      content="マップ | 食べて歩いてぺったんたん 非公式マップ"
    />
    <meta
      property="og:description"
      content="参加店舗を地図で確認。現在地から近い店舗を探せます。"
    />
    <meta
      property="og:image"
      content="https://あなたのID.github.io/pettantan-map/img/stamp.png"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Leaflet本体：必ず「CSSとJSのセット」で読み込む -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link rel="icon" type="image/png" href="img/stamp.png" />
    <script src="js/labels.js" defer></script>
    <script src="js/stamps.js" defer></script>
    <script src="js/filter.js" defer></script>
    <script src="js/map.js" defer></script>
  </head>

  <body class="map-page">
    <header class="map-header">
      <div class="container">
        <p class="site-title">
          <a href="index.html">ぺったんたんマップ</a
          ><span class="unofficial">非公式</span>
        </p>
        <div class="map-header-actions">
          <span id="map-progress" class="stamp-progress"></span>
          <button id="locate-btn" class="locate-btn" type="button">
            📍 現在地
          </button>
          <a href="index.html#shops">一覧へ ←</a>
        </div>
      </div>
    </header>

    <!-- ツールバー：常時表示はこの1行だけ -->
    <div class="map-toolbar">
      <button
        id="filter-toggle"
        class="chip"
        type="button"
        aria-expanded="false"
      >
        絞り込み ▾
      </button>
      <input
        type="search"
        id="search-box"
        class="search-box"
        placeholder="店名で検索…"
      />
      <span id="filter-count" class="filter-count"></span>
    </div>
    <!-- 開閉式パネル：既定は隠す。チップはJSがここに流し込む -->
    <div id="filter-panel" class="filter-panel" hidden>
      <div class="chip-row" id="category-chips"></div>
      <div class="chip-row" id="stamp-chips"></div>
    </div>

    <div id="map-error" class="alert error" hidden></div>
    <div id="map" aria-label="参加店舗マップ"></div>
  </body>
</html>
